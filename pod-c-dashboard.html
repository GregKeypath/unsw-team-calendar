<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Dashboard — FY27 KPIs</title>
<style>
:root {
  --bg: #f0f4f8; --surface: #ffffff; --border: #e5e7eb;
  --text: #111827; --muted: #6b7280;
  --indigo: #4f46e5;
  --sn: #e11d48; --sn-lt: #fee2e2; --sn-tx: #991b1b;
  --ae: #2563eb; --ae-lt: #dbeafe; --ae-tx: #1e40af;
  --ep: #059669; --ep-lt: #d1fae5; --ep-tx: #065f46;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 14px; min-height: 100vh; }

.period-bar { padding: 16px 20px 0; max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.period-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px; width: fit-content; }
.period-tab { padding: 6px 18px; border-radius: 6px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.period-tab.active { background: var(--indigo); color: white; font-weight: 600; }
.period-tab:hover:not(.active) { background: #f3f4f6; color: var(--text); }
.custom-range { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.custom-range label { display: flex; align-items: center; gap: 5px; }
.custom-range input[type=date] { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: inherit; color: var(--text); background: var(--surface); }
.custom-range input[type=date]:focus { outline: none; border-color: var(--indigo); }

.view { display: none; padding: 20px; max-width: 1280px; margin: 0 auto; }
.view.active { display: block; }

.period-label { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.period-label strong { color: var(--text); font-weight: 600; }

.section-hd { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 12px 0; }
.section-hd:first-of-type { margin-top: 0; }
.section-hd h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); font-weight: 600; }
.section-hd .hd-note { font-size: 11px; color: var(--muted); }

/* KPI cards */
.kpi-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 8px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; border-top: 4px solid var(--indigo); }
.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.kpi-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; }
.kpi-label { font-size: 15px; color: var(--text); font-weight: 700; margin: 2px 0 10px; }
.kpi-val { font-size: 42px; font-weight: 800; line-height: 1; color: var(--text); }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.tier-badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.tier-badge.sn { background: var(--sn-lt); color: var(--sn-tx); }
.tier-badge.ae { background: var(--ae-lt); color: var(--ae-tx); }
.tier-badge.ep { background: var(--ep-lt); color: var(--ep-tx); }
.tier-badge.sm { padding: 2px 8px; font-size: 10px; }

/* Tier scale bar inside a KPI card */
.tscale { position: relative; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 16px; background: var(--border); }
.tseg { position: absolute; top: 0; height: 100%; }
.tscale-mark { position: absolute; top: -4px; width: 3px; height: 18px; background: var(--text); border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.tscale-ticks { position: relative; height: 16px; margin-top: 3px; font-size: 10px; color: var(--muted); }
.tscale-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

/* Tier legend */
.tier-legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; border-left: 4px solid var(--border); }
.tl-card.sn { border-left-color: var(--sn); }
.tl-card.ae { border-left-color: var(--ae); }
.tl-card.ep { border-left-color: var(--ep); }
.tl-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.tl-name.sn { color: var(--sn-tx); } .tl-name.ae { color: var(--ae-tx); } .tl-name.ep { color: var(--ep-tx); }
.tl-desc { font-size: 11px; color: var(--muted); line-height: 1.45; margin-bottom: 10px; }
.tl-band { font-size: 11px; color: var(--text); display: flex; justify-content: space-between; padding: 3px 0; border-top: 1px solid var(--border); }
.tl-band span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Leaderboards */
.two-col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.lb-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.lb-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text); }
.lb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.lb-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.lb-row:last-child { border-bottom: none; }
.lb-rank { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: var(--border); color: var(--muted); flex-shrink: 0; }
.lb-rank.r1 { background: rgba(245,158,11,0.2); color: #f59e0b; }
.lb-rank.r2 { background: rgba(148,163,184,0.2); color: #94a3b8; }
.lb-rank.r3 { background: rgba(180,120,60,0.2); color: #cd7f32; }
.lb-name { flex: 1; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lb-mini-bar { width: 60px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
.lb-mini-fill { height: 100%; border-radius: 2px; }
.lb-val { font-size: 13px; font-weight: 700; min-width: 52px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* Table */
.tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th { background: #f9fafb; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 600; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fafb; }
tfoot td { font-weight: 700; background: #f9fafb; border-top: 2px solid var(--border); border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.rate-cell { display: flex; align-items: center; gap: 8px; }
.mini-bar { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; min-width: 46px; }
.mini-fill { height: 100%; border-radius: 3px; }
.rate-lbl { font-size: 13px; font-weight: 700; min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

.note-bar { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 16px; }
.no-data { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<!-- Period selector -->
<div class="period-bar">
  <div class="period-tabs">
    <button class="period-tab active" data-period="thisWeek">This Week</button>
    <button class="period-tab" data-period="lastWeek">Last Week</button>
    <button class="period-tab" data-period="custom">Custom Range</button>
  </div>
  <div class="custom-range" id="customRange" style="display:none;">
    <label>From <input type="date" id="cr-start"></label>
    <label>To <input type="date" id="cr-end"></label>
  </div>
</div>

<main class="view active" id="view-team">

  <div class="period-label" id="periodLabel"></div>
  <div class="note-bar" id="dataNote"></div>

  <div class="section-hd"><h2 id="kpiHd">FY27 Productivity KPIs</h2><span class="hd-note">Cohort = enrolled students · rolling 60-day window</span></div>
  <div class="kpi-row" id="kpiRow"></div>

  <div class="section-hd"><h2>How Performance Tiers Work</h2></div>
  <div class="tier-legend" id="tierLegend"></div>

  <div class="section-hd"><h2>Leaderboards</h2></div>
  <div class="two-col" id="lbSection"></div>

  <div class="section-hd"><h2>SSA 60-Day Coverage</h2></div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>SSA</th>
        <th class="num">Cohort</th>
        <th class="num">Attempted</th>
        <th style="min-width:190px">60-Day Attempted Rate</th>
        <th class="num">Contacted</th>
        <th style="min-width:190px">60-Day Contacted Rate</th>
      </tr></thead>
      <tbody id="covBody"></tbody>
      <tfoot id="covFoot"></tfoot>
    </table>
  </div>

</main>

<script>
// ── FY27 KPI definitions (Productivity) ─────────────────────────
// Tiers: Support Needed (< floor) · Achieved Expectations (floor–ceiling) · Exceptional (> ceiling)
var KPIS = [
  { key: 'att', metric: 'attempted', label: '60-Day Attempted Rate', cat: 'Productivity',
    floor: 80, ceiling: 90, sub: 'Unique students with ≥1 attempt ÷ cohort' },
  { key: 'con', metric: 'contacted', label: '60-Day Contacted Rate', cat: 'Productivity',
    floor: 45, ceiling: 55, sub: 'Unique students reached by phone ÷ cohort' }
];

var TIER = {
  sn: { cls: 'sn', label: 'Support Needed',         color: '#e11d48' },
  ae: { cls: 'ae', label: 'Achieved Expectations',  color: '#2563eb' },
  ep: { cls: 'ep', label: 'Exceptional Performance', color: '#059669' }
};

function tierOf(v, kpi) { return v < kpi.floor ? 'sn' : (v <= kpi.ceiling ? 'ae' : 'ep'); }
function fmtPct(v) { return (Math.round(v * 10) / 10).toFixed(1) + '%'; }

// ── Data (SAMPLE — replace with current figures) ────────────────
// Each advisor: cohort (enrolled), attempted (unique), contacted (unique).
var PERIODS = {
  thisWeek: {
    label: 'This Week', sample: true,
    advisors: [
      { name: 'Amelia Churchill',     cohort: 344, attempted: 322, contacted: 199 },
      { name: 'Kimberley Hornlimann', cohort: 336, attempted: 316, contacted: 186 },
      { name: 'Priscilla Samuel',     cohort: 339, attempted: 301, contacted: 171 },
      { name: 'Daljeet Sahota',       cohort: 335, attempted: 284, contacted: 149 },
      { name: 'James Miller',         cohort: 120, attempted: 100, contacted: 55  },
      { name: 'Saravanan Rajamani',   cohort: 270, attempted: 203, contacted: 118 }
    ]
  },
  lastWeek: {
    label: 'Last Week', sample: true,
    advisors: [
      { name: 'Amelia Churchill',     cohort: 344, attempted: 300, contacted: 180 },
      { name: 'Kimberley Hornlimann', cohort: 336, attempted: 305, contacted: 175 },
      { name: 'Priscilla Samuel',     cohort: 339, attempted: 285, contacted: 160 },
      { name: 'Daljeet Sahota',       cohort: 335, attempted: 270, contacted: 140 },
      { name: 'James Miller',         cohort: 120, attempted: 92,  contacted: 48  },
      { name: 'Saravanan Rajamani',   cohort: 270, attempted: 190, contacted: 105 }
    ]
  },
  custom: {
    label: 'Custom Range', start: '', end: '',
    advisors: []
  }
};

var currentPeriodKey = 'thisWeek';

// ── Render helpers ──────────────────────────────────────────────
function rate(a, metric, cohort) { return cohort ? (a / cohort * 100) : 0; }

function tierScale(value, kpi) {
  var f = kpi.floor, c = kpi.ceiling;
  var mark = Math.max(0, Math.min(100, value));
  return '<div class="tscale">' +
      '<div class="tseg" style="left:0;width:' + f + '%;background:' + TIER.sn.color + '33"></div>' +
      '<div class="tseg" style="left:' + f + '%;width:' + (c - f) + '%;background:' + TIER.ae.color + '33"></div>' +
      '<div class="tseg" style="left:' + c + '%;width:' + (100 - c) + '%;background:' + TIER.ep.color + '33"></div>' +
      '<div class="tscale-mark" style="left:' + mark + '%"></div>' +
    '</div>' +
    '<div class="tscale-ticks"><span style="left:' + f + '%">' + f + '%</span><span style="left:' + c + '%">' + c + '%</span></div>';
}

function renderKPIs(p) {
  var advs = p.advisors;
  document.getElementById('kpiHd').textContent = 'FY27 Productivity KPIs: ' + p.label;
  var totCohort = advs.reduce(function(s, a) { return s + a.cohort; }, 0);
  document.getElementById('kpiRow').innerHTML = KPIS.map(function(kpi) {
    var totMetric = advs.reduce(function(s, a) { return s + a[kpi.metric]; }, 0);
    var v = totCohort ? (totMetric / totCohort * 100) : 0;
    var t = tierOf(v, kpi);
    var valDisp = advs.length ? fmtPct(v) : '—';
    var subDisp = advs.length ? (totMetric + ' of ' + totCohort + ' students') : 'No data for this period';
    return '<div class="kpi-card" style="border-top-color:' + TIER[t].color + '">' +
      '<div class="kpi-top"><div><div class="kpi-cat">' + kpi.cat + '</div>' +
        '<div class="kpi-label">' + kpi.label + '</div></div>' +
        (advs.length ? '<span class="tier-badge ' + t + '">' + TIER[t].label + '</span>' : '') + '</div>' +
      '<div class="kpi-val">' + valDisp + '</div>' +
      '<div class="kpi-sub">' + subDisp + '</div>' +
      (advs.length ? tierScale(v, kpi) : '') +
    '</div>';
  }).join('');
}

function renderTierLegend() {
  var cards = [
    { cls: 'sn', name: 'Support Needed',        desc: 'Below the floor of Achieved Expectations. Triggers a structured coaching conversation to identify barriers and build an improvement plan.' },
    { cls: 'ae', name: 'Achieved Expectations', desc: 'Meeting the agreed standard. A strong result — doing the right things consistently for your students.' },
    { cls: 'ep', name: 'Exceptional Performance', desc: 'Above the ceiling. Recognised across the team — your approach becomes a coaching reference for others.' }
  ];
  document.getElementById('tierLegend').innerHTML = cards.map(function(card) {
    var bands = KPIS.map(function(kpi) {
      var range = card.cls === 'sn' ? '< ' + kpi.floor + '%'
                : card.cls === 'ae' ? kpi.floor + '% – ' + kpi.ceiling + '%'
                : '> ' + kpi.ceiling + '%';
      return '<div class="tl-band"><span>' + kpi.label.replace('60-Day ', '') + '</span><span>' + range + '</span></div>';
    }).join('');
    return '<div class="tl-card ' + card.cls + '">' +
      '<div class="tl-name ' + card.cls + '">' + card.name + '</div>' +
      '<div class="tl-desc">' + card.desc + '</div>' + bands + '</div>';
  }).join('');
}

function lbRows(sorted, kpi) {
  return sorted.slice(0, 6).map(function(a, i) {
    var v = rate(a[kpi.metric], kpi.metric, a.cohort);
    var t = tierOf(v, kpi);
    var rCls = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
    var w = Math.min(100, v).toFixed(0);
    return '<div class="lb-row"><div class="lb-rank ' + rCls + '">' + (i + 1) + '</div>' +
      '<div class="lb-name">' + a.name + '</div>' +
      '<div class="lb-mini-bar"><div class="lb-mini-fill" style="width:' + w + '%;background:' + TIER[t].color + ';"></div></div>' +
      '<div class="lb-val" style="color:' + TIER[t].color + '">' + fmtPct(v) + '</div></div>';
  }).join('');
}

function renderLeaderboards(p) {
  var advs = p.advisors;
  var empty = '<div class="no-data">No data for this period</div>';
  document.getElementById('lbSection').innerHTML = KPIS.map(function(kpi) {
    var sorted = advs.slice().sort(function(a, b) {
      return rate(b[kpi.metric], kpi.metric, b.cohort) - rate(a[kpi.metric], kpi.metric, a.cohort);
    });
    return '<div class="lb-card"><div class="lb-title">' +
      '<div class="lb-dot" style="background:' + (kpi.key === 'att' ? '#6366f1' : '#059669') + '"></div>Best ' + kpi.label + '</div>' +
      (advs.length ? lbRows(sorted, kpi) : empty) + '</div>';
  }).join('');
}

function rateCell(v, kpi) {
  var t = tierOf(v, kpi);
  var w = Math.min(100, v).toFixed(0);
  return '<div class="rate-cell">' +
    '<div class="mini-bar"><div class="mini-fill" style="width:' + w + '%;background:' + TIER[t].color + ';"></div></div>' +
    '<span class="rate-lbl" style="color:' + TIER[t].color + '">' + fmtPct(v) + '</span>' +
    '<span class="tier-badge sm ' + t + '">' + TIER[t].label.split(' ')[0] + '</span></div>';
}

function renderCoverage(p) {
  var advs = p.advisors;
  var body = document.getElementById('covBody');
  var foot = document.getElementById('covFoot');
  if (!advs.length) {
    body.innerHTML = '<tr><td colspan="6" class="no-data">No data for this period — provide current figures to populate.</td></tr>';
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = advs.map(function(a) {
    var attR = rate(a.attempted, 'attempted', a.cohort);
    var conR = rate(a.contacted, 'contacted', a.cohort);
    return '<tr><td>' + a.name + '</td>' +
      '<td class="num">' + a.cohort + '</td>' +
      '<td class="num">' + a.attempted + '</td>' +
      '<td>' + rateCell(attR, KPIS[0]) + '</td>' +
      '<td class="num">' + a.contacted + '</td>' +
      '<td>' + rateCell(conR, KPIS[1]) + '</td></tr>';
  }).join('');

  var tC = advs.reduce(function(s, a) { return s + a.cohort; }, 0);
  var tA = advs.reduce(function(s, a) { return s + a.attempted; }, 0);
  var tK = advs.reduce(function(s, a) { return s + a.contacted; }, 0);
  var attR = tC ? (tA / tC * 100) : 0;
  var conR = tC ? (tK / tC * 100) : 0;
  foot.innerHTML = '<tr><td>UNSW Total</td>' +
    '<td class="num">' + tC + '</td>' +
    '<td class="num">' + tA + '</td>' +
    '<td>' + rateCell(attR, KPIS[0]) + '</td>' +
    '<td class="num">' + tK + '</td>' +
    '<td>' + rateCell(conR, KPIS[1]) + '</td></tr>';
}

function renderPeriodLabel(p) {
  var lbl = document.getElementById('periodLabel');
  var note = document.getElementById('dataNote');
  if (currentPeriodKey === 'custom') {
    lbl.innerHTML = (p.start && p.end)
      ? 'Showing <strong>' + p.start + '</strong> to <strong>' + p.end + '</strong>'
      : 'Pick a <strong>From</strong> and <strong>To</strong> date, then load the figures for that range.';
  } else {
    lbl.innerHTML = '<strong>' + p.label + '</strong> · rolling 60-day cohort coverage';
  }
  if (p.sample) {
    note.style.display = 'block';
    note.textContent = '⚠️ Sample figures shown to preview the layout — send current data and I will replace them.';
  } else {
    note.style.display = 'none';
  }
}

function render(periodKey) {
  var p = PERIODS[periodKey];
  renderPeriodLabel(p);
  renderKPIs(p);
  renderTierLegend();
  renderLeaderboards(p);
  renderCoverage(p);
}

document.querySelectorAll('.period-tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.period-tab').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentPeriodKey = btn.dataset.period;
    document.getElementById('customRange').style.display = (currentPeriodKey === 'custom') ? 'flex' : 'none';
    render(currentPeriodKey);
  });
});

document.getElementById('cr-start').addEventListener('change', function() { PERIODS.custom.start = this.value; render('custom'); });
document.getElementById('cr-end').addEventListener('change', function() { PERIODS.custom.end = this.value; render('custom'); });

render('thisWeek');
</script>
</body>
</html>
